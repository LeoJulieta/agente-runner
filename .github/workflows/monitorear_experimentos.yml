name: Monitorear Experimentos

on:
  workflow_dispatch:
  schedule:
    # Semanal, lunes 12:00 UTC -- despues del cron del Paso 1 (domingo
    # 20:00 UTC), para que haya tenido tiempo de correr antes.
    - cron: '0 12 * * 1'

jobs:
  monitorear:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo privado (agente-autonomo)
        uses: actions/checkout@v4
        with:
          repository: LeoJulieta/agente-autonomo
          token: ${{ secrets.PRIVATE_REPO_PAT }}

      - name: Instalar dependencias
        run: pip install supabase

      - name: Ejecutar monitoreo
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python3 monitorear_experimentos.py
