name: Lab Batch - Ejecutar Lote de Hipótesis
'on':
  workflow_dispatch:
    inputs:
      hypothesis_ids:
        description: 'IDs separados por coma (ej: H002,H003)'
        required: true
        type: string
      time_window:
        description: 'Ventana temporal opcional: lt:<ISO> o gte:<ISO>'
        required: false
        default: ''
        type: string
      dataset_rows_at_cutoff:
        description: 'Filas con outcome al momento del preregistro del corte (opcional)'
        required: false
        default: ''
        type: string
concurrency:
  group: lab-batch-secuencial
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      HYPOTHESIS_IDS: ${{ inputs.hypothesis_ids }}
      TIME_WINDOW: ${{ inputs.time_window }}
      CUTOFF_ROWS: ${{ inputs.dataset_rows_at_cutoff }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gate 0 - validar manifiesto congelado antes del motor
        run: |
          set -euo pipefail
          python labs/pr_d_manifest.py --manifest docs/manifest.json
          # This committed manifest is intentionally a test fixture, never runnable.
          # Fail closed until a separately reviewed, real preregistration replaces it.
          python - <<'PY'
          import json, sys
          with open("docs/manifest.json", encoding="utf-8") as f:
              manifest = json.load(f)
          if manifest["manifest_version"].startswith("test-only-"):
              print("PR-D-GATE-0: BLOCKED: test-only manifest; engine must not run.", file=sys.stderr)
              raise SystemExit(2)
          requested = {x.strip() for x in __import__("os").environ["HYPOTHESIS_IDS"].split(",") if x.strip()}
          frozen = {hid for family in manifest["families"] for hid in family["hypothesis_ids"]}
          if not requested or requested != frozen:
              print("PR-D-GATE-0: BLOCKED: requested IDs differ from frozen manifest.", file=sys.stderr)
              raise SystemExit(2)
          PY
      - name: Install dependencies
        run: pip install supabase pyyaml
      - name: Ejecutar lote secuencial
        run: |
          set -euo pipefail
          for id in $(printf '%s' "$HYPOTHESIS_IDS" | tr ',' ' '); do
            case "$id" in
              H[0-9][0-9][0-9]*)
                ;;
              *)
                echo "ID inválido: $id"
                exit 1
                ;;
            esac
            echo "=== Hipótesis $id ==="
            ARGS=(--hypothesis "$id")
            if [ -n "$TIME_WINDOW" ]; then ARGS+=(--window "$TIME_WINDOW"); fi
            if [ -n "$CUTOFF_ROWS" ]; then ARGS+=(--cutoff-rows "$CUTOFF_ROWS"); fi
            python labs/lab_engine.py "${ARGS[@]}"
          done
