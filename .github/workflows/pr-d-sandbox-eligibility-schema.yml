name: PR D sandbox eligibility and schema checks

on:
  push:
    branches:
      - sandbox/pr-d-cohort-eligibility-schema-2026-11-12
    paths:
      - "labs/pr_d_cohort_builder.py"
      - "labs/pr_d_family_ii.py"
      - "labs/pr_d_cohort_estimator.py"
      - "labs/pr_d_sync_contract.py"
      - "labs/pr_d_youtube_collector.py"
      - "tests/test_pr_d_sync_cohort_estimator_e2e.py"
      - "tests/test_pr_d_family_ii_validation.py"
      - "tests/test_pr_d_drift_reproducibility.py"
      - "tests/test_pr_d_cohort_builder_eligibility.py"
      - "tests/test_pr_d_e12_provenance_guard.py"
      - "tests/test_pr_d_youtube_collector.py"
      - "requirements/pr-d-statistical-fixtures-py312.txt"
      - "tests/test_pr_d_manifest.py"
      - "tests/test_pr_d_e2e_quarantine.py"
      - "tests/test_pr_d_single_run_gate.py"
      - "tests/test_pr_d_power_result_fixtures_candidate.py"
      - "tests/test_pr_d_statistical_edge_fixtures_candidate.py"
      - "tests/test_pr_d_statistical_fixtures.py"
      - "tests/integration/test_pr_d_engine_atomic_path.py"
      - "tests/integration/test_pr_d_atomic_rpc.py"
      - "tests/integration/test_pr_d_sync_schema_compatibility.py"
      - "tests/fixtures/pr_d_youtube_shorts_log_schema.sql"
      - "tests/e2e/bootstrap_pr_d_postgrest.py"
      - "tests/e2e/test_pr_d_postgrest_isolated_http.py"
      - "tests/fixtures/pr_d_atomic_rpc_http_bootstrap.sql"
      - "supabase/migrations/004_pr_d_v2_atomic_persistence.sql"
      - "supabase/migrations/20261112160000_pr_d_sync_capture_provenance_candidate.sql"
      - ".github/workflows/pr-d-sandbox-eligibility-schema.yml"

# A newer push supersedes older sandbox validation runs on this same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-eligibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements/pr-d-statistical-fixtures-py312.txt
      - name: Run eligibility-first cohort and estimator integration tests
        run: python -m pytest -q tests/test_pr_d_cohort_builder_eligibility.py tests/test_pr_d_e12_provenance_guard.py tests/test_pr_d_youtube_collector.py tests/test_pr_d_sync_cohort_estimator_e2e.py tests/test_pr_d_family_ii_validation.py tests/test_pr_d_drift_reproducibility.py tests/test_pr_d_manifest.py tests/test_pr_d_e2e_quarantine.py tests/test_pr_d_single_run_gate.py tests/test_pr_d_power_result_fixtures_candidate.py tests/test_pr_d_statistical_edge_fixtures_candidate.py tests/test_pr_d_statistical_fixtures.py tests/integration/test_pr_d_engine_atomic_path.py

  disposable-postgres-schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Docker Official Image 17.11 multi-platform index digest; immutable.
        image: postgres:17.11@sha256:653186fe15006c099d2fb3bc1d8461c1dee9d036c43f2e5fdaf4f22e5e601876
        env:
          POSTGRES_USER: prd_test
          POSTGRES_PASSWORD: prd_test
          POSTGRES_DB: prd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prd_test -d prd_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://prd_test:prd_test@localhost:5432/prd_test
      PR_D_DISPOSABLE_DATABASE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements/pr-d-statistical-fixtures-py312.txt
      - name: Apply candidate migration to disposable schema and test CAS
        run: python -m pytest -q tests/integration/test_pr_d_sync_schema_compatibility.py

  windows-iana-timezone:
    # Pin the runner generation; do not follow the moving windows-latest alias.
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned dependencies including IANA tzdata
        run: python -m pip install --disable-pip-version-check -r requirements/pr-d-statistical-fixtures-py312.txt
      - name: Verify IANA timezone conversion and temporal eligibility on Windows
        run: python -m pytest -q tests/test_pr_d_sync_cohort_estimator_e2e.py


  postgrest-http-disposable:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11@sha256:653186fe15006c099d2fb3bc1d8461c1dee9d036c43f2e5fdaf4f22e5e601876
        env:
          POSTGRES_USER: prd_test
          POSTGRES_PASSWORD: prd_test
          POSTGRES_DB: prd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prd_test -d prd_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://prd_test:prd_test@localhost:5432/prd_test
      SUPABASE_URL: http://127.0.0.1:3000
      PR_D_TEST_JWT_SECRET: pr-d-http-e2e-only-secret-32-bytes-minimum
      PR_D_DISPOSABLE_DATABASE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements/pr-d-statistical-fixtures-py312.txt
      - name: Bootstrap only the identity-verified disposable database
        run: python tests/e2e/bootstrap_pr_d_postgrest.py
      - name: Start pinned PostgREST after PostgreSQL health check
        run: >-
          docker run -d --name prd-postgrest --network host
          -e PGRST_DB_URI=postgres://authenticator:prd_test_auth@127.0.0.1:5432/prd_test
          -e PGRST_DB_SCHEMAS=public
          -e PGRST_DB_ANON_ROLE=anon
          -e PGRST_JWT_SECRET=pr-d-http-e2e-only-secret-32-bytes-minimum
          postgrest/postgrest:v12.2.12@sha256:5f4ce744539bbba786b4e24dbbd95bdb2a956dcf568c5374995a0ff4a68f5bd2
      - name: Exercise actual PostgREST HTTP RPC against disposable PostgreSQL
        run: python -m pytest -q tests/e2e/test_pr_d_postgrest_isolated_http.py
      - name: Stop disposable PostgREST container
        if: always()
        run: docker rm -f prd-postgrest || true
