name: PR D v2 - Atomic RPC integration

on:
  pull_request:
    paths:
      - "supabase/migrations/004_pr_d_v2_atomic_persistence.sql"
      - "labs/lab_engine.py"
      - "tests/integration/test_pr_d_atomic_rpc.py"
      - ".github/workflows/pr-d-atomic-rpc.yml"
  workflow_dispatch:

jobs:
  postgres-atomic-rpc:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d prd_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/prd_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Run real PostgreSQL atomicity, idempotency and concurrency tests
        run: python -m pytest -q tests/integration/test_pr_d_atomic_rpc.py
