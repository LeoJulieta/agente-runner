name: PR D v2 - Atomic RPC integration

on:
  pull_request:
    paths:
      - "supabase/migrations/004_pr_d_v2_atomic_persistence.sql"
      - "labs/lab_engine.py"
      - "labs/pr_d_inference.py"
      - "tests/integration/test_pr_d_atomic_rpc.py"
      - "tests/integration/test_pr_d_engine_atomic_path.py"
      - "tests/test_pr_d_inference_t08_t12.py"
      - "labs/pr_d_family_ii.py"
      - "tests/test_pr_d_family_ii_t09_drift_reproducibility.py"
      - ".github/workflows/pr-d-atomic-rpc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-atomic-rpc:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d prd_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/prd_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install "psycopg[binary]>=3.2,<4" "pytest>=8,<9" "numpy>=1.26,<3" "scipy>=1.11,<2" "statsmodels>=0.14,<1"
      - name: Verify official manifest remains fixture
        run: python -c 'import json; p=json.load(open("docs/manifest.json", encoding="utf-8")); assert p["execution_status"] == "fixture"'
      - name: Run real PostgreSQL atomicity, idempotency and concurrency tests
        run: python -m pytest -q tests/integration/test_pr_d_atomic_rpc.py tests/integration/test_pr_d_engine_atomic_path.py
      - name: Run deterministic synthetic T08/T12 tests only
        run: python -m pytest -q tests/test_pr_d_inference_t08_t12.py
      - name: Run deterministic synthetic Family II, drift and reproducibility tests
        run: python -m pytest -q tests/test_pr_d_family_ii_t09_drift_reproducibility.py
