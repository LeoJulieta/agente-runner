name: E12 lease and fencing sandbox tests

concurrency:
  group: e12-lease-fencing-sandbox-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - sandbox/e12-lease-provenance-2026-11-12
      - sandbox/e12-batch-cas-2026-11-13
      - sandbox/e12-postgrest-contract-2026-11-13
    paths:
      - "supabase/functions/e12-capture/**"
      - "supabase/ops/e12_worker_lease_fencing.sql"
      - "supabase/ops/e12_collector_attestation.sql"
      - "supabase/ops/e12_capture_batch_cas.sql"
      - "supabase/migrations/*_e12_capture_batch_cas.sql"
      - "supabase/migrations/*_e12_collector_attestation.sql"
      - "supabase/migrations/*_e12_worker_lease_fencing.sql"
      - "tests/e12/**"
      - ".github/workflows/e12-lease-fencing-sandbox.yml"

permissions:
  contents: read

jobs:
  lease-fencing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e12_lease_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d e12_lease_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: supabase/setup-cli@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify formatter and Deno worker/collector/lease tests
        run: |
          deno fmt supabase/functions/e12-capture
          deno fmt --check supabase/functions/e12-capture
          deno test supabase/functions/e12-capture/worker_test.ts supabase/functions/e12-capture/collector_test.ts supabase/functions/e12-capture/lease_test.ts supabase/functions/e12-capture/provenance_test.ts
      - name: Generate migration filename with Supabase CLI v3
        shell: bash
        run: |
          set -euo pipefail
          workdir="$RUNNER_TEMP/e12-migration-generator"
          mkdir -p "$workdir"
          cd "$workdir"
          supabase init
          supabase migration new e12_worker_lease_fencing
          migration="$(find supabase/migrations -maxdepth 1 -name '*_e12_worker_lease_fencing.sql' -print -quit)"
          test -n "$migration"
          cmp "$GITHUB_WORKSPACE/supabase/ops/e12_worker_lease_fencing.sql" "$GITHUB_WORKSPACE/supabase/migrations/20261112231203_e12_worker_lease_fencing.sql"
          cp "$GITHUB_WORKSPACE/supabase/migrations/20261112231203_e12_worker_lease_fencing.sql" "$migration"
          test -s "$migration"
          echo "Generated disposable migration path: $migration"
          sha256sum "$migration"
      - name: Generate collector attestation migration filename with Supabase CLI v3
        shell: bash
        run: |
          set -euo pipefail
          workdir="$RUNNER_TEMP/e12-attestation-migration-generator"
          mkdir -p "$workdir"
          cd "$workdir"
          supabase init
          supabase migration new e12_collector_attestation
          migration="$(find supabase/migrations -maxdepth 1 -name '*_e12_collector_attestation.sql' -print -quit)"
          test -n "$migration"
          cmp "$GITHUB_WORKSPACE/supabase/ops/e12_collector_attestation.sql" "$GITHUB_WORKSPACE/supabase/migrations/20261112232558_e12_collector_attestation.sql"
          cp "$GITHUB_WORKSPACE/supabase/migrations/20261112232558_e12_collector_attestation.sql" "$migration"
          test -s "$migration"
          echo "Generated disposable attestation migration path: $migration"
          sha256sum "$migration"
      - name: Generate batch CAS migration filename with Supabase CLI v3
        shell: bash
        run: |
          set -euo pipefail
          workdir="$RUNNER_TEMP/e12-batch-migration-generator"
          mkdir -p "$workdir"
          cd "$workdir"
          supabase init
          supabase migration new e12_capture_batch_cas
          migration="$(find supabase/migrations -maxdepth 1 -name '*_e12_capture_batch_cas.sql' -print -quit)"
          test -n "$migration"
          cmp "$GITHUB_WORKSPACE/supabase/ops/e12_capture_batch_cas.sql" "$GITHUB_WORKSPACE/supabase/migrations/20261113090000_e12_capture_batch_cas.sql"
          cp "$GITHUB_WORKSPACE/supabase/migrations/20261113090000_e12_capture_batch_cas.sql" "$migration"
          test -s "$migration"
          echo "Generated disposable batch CAS migration path: $migration"
          sha256sum "$migration"
      - name: Install PostgreSQL test dependency
        run: python -m pip install "psycopg[binary]>=3.2,<4" "pytest>=8,<9"
      - name: Run real PostgreSQL lease/fencing adversarial tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/e12_lease_test
          E12_LEASE_SQL_PATH: ${{ github.workspace }}/supabase/migrations/20261112231203_e12_worker_lease_fencing.sql
          E12_ATTESTATION_SQL_PATH: ${{ github.workspace }}/supabase/migrations/20261112232558_e12_collector_attestation.sql
          E12_BATCH_SQL_PATH: ${{ github.workspace }}/supabase/migrations/20261113090000_e12_capture_batch_cas.sql
        run: python -m pytest -q tests/e12/test_worker_lease_fencing.py

  postgrest-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/e12_postgrest_test
      E12_LEASE_SQL_PATH: ${{ github.workspace }}/supabase/migrations/20261112231203_e12_worker_lease_fencing.sql
      E12_ATTESTATION_SQL_PATH: ${{ github.workspace }}/supabase/migrations/20261112232558_e12_collector_attestation.sql
      E12_BATCH_SQL_PATH: ${{ github.workspace }}/supabase/migrations/20261113090000_e12_capture_batch_cas.sql
      PGRST_JWT_SECRET: e12-postgrest-ci-jwt-secret-not-real-32-bytes-long!
      POSTGREST_URL: http://127.0.0.1:3000/rest/v1
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e12_postgrest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d e12_postgrest_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install disposable integration test dependencies
        run: python -m pip install "psycopg[binary]>=3.2,<4" "pytest>=8,<9" "cryptography>=44,<46"
      - name: Bootstrap isolated roles, fixtures and E12 migrations
        run: python tests/e12/prepare_postgrest.py
      - name: Start disposable PostgREST against the local PostgreSQL service
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name e12-postgrest --network host \
            -e PGRST_DB_URI="postgres://authenticator:e12-ci-authenticator-only@127.0.0.1:5432/e12_postgrest_test" \
            -e PGRST_DB_SCHEMAS=public \
            -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_JWT_SECRET="$PGRST_JWT_SECRET" \
            -e PGRST_SERVER_PORT=3000 \
            postgrest/postgrest:v12.2.3
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs e12-postgrest
          exit 1
      - name: Run the complete Deno worker against real PostgREST HTTP and simulated YouTube
        run: deno test --allow-env --allow-net supabase/functions/e12-capture/worker_postgrest_e2e_test.ts
      - name: Exercise RPC binding, fencing and role boundary over HTTP
        run: python -m pytest -q tests/e12/test_postgrest_integration.py
      - name: Stop disposable PostgREST
        if: always()
        run: |
          docker logs e12-postgrest || true
          docker rm -f e12-postgrest || true
