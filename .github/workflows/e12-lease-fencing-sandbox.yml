name: E12 lease and fencing sandbox tests

on:
  push:
    branches:
      - sandbox/e12-lease-provenance-2026-11-12
    paths:
      - "supabase/functions/e12-capture/**"
      - "supabase/ops/e12_worker_lease_fencing.sql"
      - "tests/e12/**"
      - ".github/workflows/e12-lease-fencing-sandbox.yml"

permissions:
  contents: read

jobs:
  lease-fencing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e12_lease_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d e12_lease_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: supabase/setup-cli@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify formatter and Deno worker/collector/lease tests
        run: |
          deno fmt --check supabase/functions/e12-capture
          deno test supabase/functions/e12-capture/worker_test.ts supabase/functions/e12-capture/collector_test.ts supabase/functions/e12-capture/lease_test.ts
      - name: Generate migration filename with Supabase CLI v3
        shell: bash
        run: |
          set -euo pipefail
          workdir="$RUNNER_TEMP/e12-migration-generator"
          mkdir -p "$workdir"
          cd "$workdir"
          supabase init
          supabase migration new e12_worker_lease_fencing
          migration="$(find supabase/migrations -maxdepth 1 -name '*_e12_worker_lease_fencing.sql' -print -quit)"
          test -n "$migration"
          cp "$GITHUB_WORKSPACE/supabase/ops/e12_worker_lease_fencing.sql" "$migration"
          test -s "$migration"
          echo "Generated disposable migration path: $migration"
          sha256sum "$migration"
      - name: Install PostgreSQL test dependency
        run: python -m pip install "psycopg[binary]>=3.2,<4" "pytest>=8,<9"
      - name: Run real PostgreSQL lease/fencing adversarial tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/e12_lease_test
          E12_LEASE_SQL_PATH: \${{ github.workspace }}/supabase/ops/e12_worker_lease_fencing.sql
        run: python -m pytest -q tests/e12/test_worker_lease_fencing.py
