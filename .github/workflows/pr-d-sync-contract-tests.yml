name: PR D v3 candidate - synthetic producer sync tests

on:
  pull_request:
    branches: ["fix/pr-d-inference-block-2"]
    paths:
      - "labs/pr_d_sync_contract.py"
      - "tests/test_pr_d_sync_contract.py"
      - "tests/integration/test_pr_d_sync_write_once.py"
      - ".github/workflows/pr-d-sync-contract-tests.yml"

permissions:
  contents: read

jobs:
  synthetic-temporal-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install synthetic statistical test dependencies
        run: python -m pip install "pytest>=8,<9" "numpy>=1.26,<3" "scipy>=1.11,<2" "statsmodels>=0.14,<1"
      - name: Assert checked-in manifest remains fixture
        run: python -c 'import json; p=json.load(open("docs/manifest.json", encoding="utf-8")); assert p["execution_status"] == "fixture"'
      - name: Run temporal provenance, boundary, missing-data and timezone tests
        run: python -m pytest -q tests/test_pr_d_sync_contract.py
      - name: Run cohort builder and Family II synthetic handoff
        run: python -m pytest -q tests/test_pr_d_cohort_builder.py tests/test_pr_d_family_ii_t09_drift_reproducibility.py

  disposable-postgres-write-once:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prd_sync_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d prd_sync_fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/prd_sync_fixture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL test driver
        run: python -m pip install "psycopg[binary]>=3.2,<4" "pytest>=8,<9"
      - name: Assert checked-in manifest remains fixture
        run: python -c 'import json; p=json.load(open("docs/manifest.json", encoding="utf-8")); assert p["execution_status"] == "fixture"'
      - name: Test atomic first-write-wins and concurrent compare-and-set
        run: python -m pytest -q tests/integration/test_pr_d_sync_write_once.py
