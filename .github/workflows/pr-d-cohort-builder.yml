name: PR D v2 - Synthetic cohort builder tests

on:
  pull_request:
    branches: ["fix/pr-d-inference-block-2"]
    paths:
      - "labs/pr_d_cohort_builder.py"
      - "tests/test_pr_d_cohort_builder.py"
      - ".github/workflows/pr-d-cohort-builder.yml"

permissions:
  contents: read

jobs:
  synthetic-cohort:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated cohort PR
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install synthetic statistical test dependencies
        run: python -m pip install "pytest>=8,<9" "numpy>=1.26,<3" "scipy>=1.11,<2" "statsmodels>=0.14,<1"
      - name: Assert checked-in manifest remains fixture
        run: python -c 'import json; p=json.load(open("docs/manifest.json", encoding="utf-8")); assert p["execution_status"] == "fixture"'
      - name: Run cohort boundary, null, alignment and Family II handoff tests
        run: python -m pytest -q tests/test_pr_d_cohort_builder.py
      - name: Run existing Family II regression tests
        run: python -m pytest -q tests/test_pr_d_family_ii_t09_drift_reproducibility.py
