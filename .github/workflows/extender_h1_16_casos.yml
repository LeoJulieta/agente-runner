name: Extender H1 a 16 casos (manual, una vez)

on:
  workflow_dispatch:

jobs:
  extender:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo privado (agente-autonomo)
        uses: actions/checkout@v4
        with:
          repository: LeoJulieta/agente-autonomo
          token: ${{ secrets.PRIVATE_REPO_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements_shorts.txt

      - name: Ejecutar extension de H1
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
        run: python3 extender_h1_16_casos.py
