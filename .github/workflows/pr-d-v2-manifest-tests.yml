name: PR D v2 manifest gate tests

on:
  pull_request:
    branches: [main]
    paths:
      - "labs/pr_d_manifest.py"
      - "docs/manifest.json"
      - "docs/PR-D-DESIGN.md"
      - "tests/test_pr_d_manifest.py"
      - ".github/workflows/lab_batch.yml"
      - ".github/workflows/pr-d-v2-manifest-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR revision
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest -v tests.test_pr_d_manifest
      - name: Verify corrupt manifest exits 2 and engine is not invoked
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          printf '{broken json' > "$tmp/corrupt.json"
          set +e
          python labs/pr_d_manifest.py --manifest "$tmp/corrupt.json"
          rc=$?
          set -e
          test "$rc" -eq 2
          # The engine marker must remain absent: invalid manifest means no engine step.
          if [ -e "$tmp/engine_invoked" ]; then
            echo "FAIL: engine marker exists despite corrupt manifest"
            exit 1
          fi
          echo "PASS: corrupt manifest exit=$rc; engine invocation absent"
      - name: Diagnostic - actual frozen contract SHA-256
        run: sha256sum docs/PR-D-DESIGN.md
      - name: Validate checked-in fixture manifest
        run: python labs/pr_d_manifest.py --manifest docs/manifest.json
