name: Importar Studio Export (automático)

on:
  push:
    paths:
      - 'studio_zips_pendientes/*.zip'

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install supabase

      - name: Importar ZIPs pendientes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python importar_studio_export.py

      - name: Commit de los archivos movidos a procesados/
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add studio_zips_pendientes/
          git diff --staged --quiet || git commit -m "Auto: ZIPs de Studio procesados y movidos"
          git push
