name: PR D v2 PostgreSQL isolation tests

on:
  pull_request:
    paths:
      - "tests/pr_d_v2_postgres/**"
      - ".github/workflows/pr-d-postgres-isolation.yml"
  workflow_dispatch:

jobs:
  postgres-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: prd_test
          POSTGRES_USER: prd_test
          POSTGRES_PASSWORD: prd_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prd_test -d prd_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://prd_test:prd_test_only@localhost:5432/prd_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Run isolated PostgreSQL semantics tests
        run: python -m unittest discover -s tests/pr_d_v2_postgres -v
