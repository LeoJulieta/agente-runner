name: Lab Tracer - Fase 0 P/L/D/E

on:
  workflow_dispatch:

jobs:
  tracer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install supabase

      - name: Ejecutar lab_001_tracer
        run: python labs/lab_001_tracer.py
