name: Authenticated approval reviewer Supabase HTTP E2E

on:
  push:
    branches:
      - security/authenticated-approval-reviewer-flow-2026-11-14
    paths:
      - "supabase/migrations/20261114190000_authenticated_approval_reviewer_flow.sql"
      - "tests/e2e/test_approval_reviewer_postgrest.py"
      - ".github/workflows/approval-reviewer-supabase-http-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supabase-auth-postgrest-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: supabase/setup-cli@v3
      - name: Install test dependencies
        run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Provision disposable Supabase and test real Auth JWT over PostgREST
        shell: bash
        run: |
          set -euo pipefail
          workdir="$RUNNER_TEMP/approval-reviewer-supabase-e2e"
          mkdir -p "$workdir"
          cd "$workdir"

          # This is a fresh local Supabase stack, never linked to the hosted project.
          supabase init
          supabase migration new approval_reviewer_baseline
          sleep 2
          baseline="$(find supabase/migrations -maxdepth 1 -name '*_approval_reviewer_baseline.sql' -print -quit)"
          test -n "$baseline"
          cat > "$baseline" <<'SQL'
          CREATE TABLE public.pending_approvals (
              id text PRIMARY KEY,
              title text NOT NULL,
              payload jsonb NOT NULL DEFAULT '{}'::jsonb,
              reasoning text NOT NULL DEFAULT '',
              type text NOT NULL DEFAULT 'other',
              status text NOT NULL DEFAULT 'pending',
              created_at timestamptz NOT NULL DEFAULT clock_timestamp(),
              resolved_at timestamptz
          );
          ALTER TABLE public.pending_approvals ENABLE ROW LEVEL SECURITY;
          GRANT ALL PRIVILEGES ON TABLE public.pending_approvals
              TO anon, authenticated, service_role;
          CREATE POLICY "Permitir lectura anon"
              ON public.pending_approvals FOR SELECT TO anon USING (true);
          CREATE POLICY "Permitir update anon"
              ON public.pending_approvals FOR UPDATE TO anon
              USING (status = 'pending')
              WITH CHECK (status IN ('approved','rejected') AND resolved_at IS NOT NULL);
          SQL

          supabase migration new authenticated_approval_reviewer_flow
          candidate="$(find supabase/migrations -maxdepth 1 -name '*_authenticated_approval_reviewer_flow.sql' -print -quit)"
          test -n "$candidate"
          cp "$GITHUB_WORKSPACE/supabase/migrations/20261114190000_authenticated_approval_reviewer_flow.sql" "$candidate"

          supabase start -x studio,inbucket,analytics,vector
          trap 'supabase stop --no-backup >/dev/null 2>&1 || true' EXIT

          supabase status -o env > "$RUNNER_TEMP/approval-reviewer-supabase.env"
          set -a
          source "$RUNNER_TEMP/approval-reviewer-supabase.env"
          set +a
          test -n "$API_URL"
          test -n "$DB_URL"
          test -n "$SERVICE_ROLE_KEY"
          test -n "$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          echo "::add-mask::$ANON_KEY"
          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export TEST_DATABASE_URL="$DB_URL"
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests/e2e" -p "test_approval_reviewer_postgrest.py" -v
