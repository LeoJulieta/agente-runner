name: Sincronizar Audiencia Demografica

on:
  schedule:
    # Una vez por dia, 6am UTC -- no hace falta mas seguido, la demografia
    # no cambia de hora en hora como si lo hacen views/retention.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      debug:
        description: "Modo debug"
        required: false
        default: "false"

jobs:
  sincronizar-audiencia:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo privado (agente-autonomo)
        uses: actions/checkout@v4
        with:
          repository: LeoJulieta/agente-autonomo
          token: ${{ secrets.GH_PAT }}
          path: agente-autonomo

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias Python
        working-directory: agente-autonomo
        run: |
          pip install --break-system-packages requests supabase google-auth google-auth-oauthlib google-api-python-client

      - name: Ejecutar sincronizacion de audiencia
        working-directory: agente-autonomo
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          DEBUG_MODE: ${{ github.event.inputs.debug }}
        run: python sincronizar_audiencia_demografica.py
