name: PR D v2 - Synthetic statistical acceptance T08/T12

on:
  pull_request:
    paths:
      - "labs/pr_d_inference.py"
      - "tests/test_pr_d_inference_t08_t12.py"
      - ".github/workflows/pr-d-statistical-t08-t12.yml"

permissions:
  contents: read

jobs:
  synthetic-t08-t12:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated statistical test dependencies
        run: python -m pip install "numpy>=1.26,<3" "scipy>=1.11,<2" "statsmodels>=0.14,<1" "pytest>=8,<9"
      - name: Verify official manifest remains fixture
        run: python -c 'import json; p=json.load(open("docs/manifest.json", encoding="utf-8")); assert p["execution_status"] == "fixture"'
      - name: Run deterministic synthetic T08/T12 tests only
        run: python -m pytest -q tests/test_pr_d_inference_t08_t12.py
