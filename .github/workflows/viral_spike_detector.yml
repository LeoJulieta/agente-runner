name: Detector de videos virales (YouTube Shorts)

on:
  schedule:
    # Cada 30 min -- necesita ser mas frecuente que el ciclo normal (3hs)
    # para agarrar un video en racha mientras el trending sigue caliente.
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  detectar-y-publicar-seguimiento:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repo privado (agente-autonomo)
        uses: actions/checkout@v4
        with:
          repository: LeoJulieta/agente-autonomo
          token: ${{ secrets.PRIVATE_REPO_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias del sistema
        # Mismas que youtube_shorts.yml: si detecta un video en racha, dispara
        # trend_monitor.publicar_video_emergencia(), que corre el pipeline
        # completo de generacion de video (necesita ffmpeg y fuentes).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation

      - name: Instalar dependencias Python
        run: |
          pip install --upgrade pip
          pip install -r requirements_shorts.txt

      - name: Ejecutar detector de videos virales
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          # FIX (19/8): mismo agujero que en youtube_shorts.yml -- si este
          # detector dispara publicar_video_emergencia() sobre un candidato
          # de Brasil, corre youtube_shorts_agent.py entero y necesita este
          # secret mapeado aca, no alcanza con que exista en Settings.
          VOCES_TTS_PT_BR_CONFIRMADA: ${{ secrets.VOCES_TTS_PT_BR_CONFIRMADA }}
          # Estas tres no las usa viral_spike_detector.py directamente, pero
          # si dispara un seguimiento, publicar_video_emergencia() corre
          # youtube_shorts_agent.py entero -- incluido el hook de
          # evolution_engine al inicio de main(), que si las necesita.
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ secrets.GH_REPO }}
          MAKE_WEBHOOK_GITHUB_FILES: ${{ secrets.MAKE_WEBHOOK_GITHUB_FILES }}
        run: |
          python viral_spike_detector.py

      - name: Limpiar archivos temporales
        if: always()
        run: |
          rm -f /tmp/youtube_short_final.mp4
