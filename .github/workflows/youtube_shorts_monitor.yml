name: Monitor Google Trends -- Publicacion de Emergencia

on:
  schedule:
    # NOTA: el cron original de sesion 16 lo redujo de cada 30 min a cada 1
    # hora para no gastar minutos gratis del repo privado. Ahora que corre en
    # el Repo B (publico, minutos ilimitados), se puede volver a cada 30 min
    # si Leo quiere respuesta mas rapida ante señales de Breakout -- queda
    # en 1 hora por ahora, cambiar a '*/30 * * * *' cuando lo confirme.
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  monitor-y-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo privado (agente-autonomo)
        uses: actions/checkout@v4
        with:
          repository: LeoJulieta/agente-autonomo
          token: ${{ secrets.PRIVATE_REPO_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation
          pip install --upgrade pip
          pip install -r requirements_shorts.txt

      - name: Ejecutar monitor de tendencias
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          MODO_MONITOR: "true"
        run: |
          python trend_monitor.py

      - name: Limpiar
        if: always()
        run: rm -f /tmp/youtube_short_final.mp4
