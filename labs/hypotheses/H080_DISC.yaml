id: H080_DISC
class: A
gen: 1
dataset:
- youtube_shorts_log
vars:
  independent:
  - dia_semana
  dependent:
  - views_primeras_3h
metric:
  primary: correlation
baseline:
  type: fixed
  value: 0.3
comparison:
  type: greater_than
  description: Correlación medida > umbral
sample_min: 30
max_runtime: 300
cost_limit: 0
authorized: false
population_type: discoverer
category: unknown
var_roles:
  dia_semana: actionable_pre_publicacion
  views_primeras_3h: outcome
derive:
  dia_semana:
    source: created_at
    extract: weekday
    tz_offset_hours: -3
assumption_under_test: el_efecto_de_la_hora_es_estable_entre_dias_de_semana
