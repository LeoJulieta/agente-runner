id: H015_EXPL
class: A
gen: 0
dataset:
- youtube_shorts_log
vars:
  independent:
  - hora_publicacion
  dependent:
  - views_primeras_3h
metric:
  primary: correlation
baseline:
  type: fixed
  value: -0.2
comparison:
  type: less_than
  description: Correlación negativa > 0.2
sample_min: 30
max_runtime: 300
cost_limit: 0
authorized: false
population_type: exploiter
category: membresias_newsletter
income_category: membresias_newsletter
derive:
  hora_publicacion:
    source: created_at
    extract: hour
    tz_offset_hours: -3
    subtract_hours_from_column: hs_al_publicar_al_sync
expected_direction: negative
