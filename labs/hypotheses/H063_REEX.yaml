id: H063_REEX
class: A
gen: 1
dataset:
- youtube_shorts_log
vars:
  independent:
  - hora_publicacion
  dependent:
  - views_primeras_3h
metric:
  primary: correlation
baseline:
  type: fixed
  value: 0.3
comparison:
  type: greater_than
  description: Correlación medida > umbral
sample_min: 30
max_runtime: 300
cost_limit: 0
authorized: false
population_type: reexplorer
category: plantillas_venta
income_category: plantillas_venta
var_roles:
  hora_publicacion: actionable_pre_publicacion
  views_primeras_3h: outcome
derive:
  hora_publicacion:
    source: created_at
    extract: hour
    tz_offset_hours: -3
    subtract_hours_from_column: hs_al_publicar_al_sync
